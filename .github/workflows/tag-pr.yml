name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  j1_of_3-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint

  j2_of_3-test:
    runs-on: ubuntu-latest
    needs: j1_of_3-lint
    timeout-minutes: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test

  j3_of_3-cleanup:
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write
      contents: read
    env:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Delete old workflow runs
        env:
          KEEP_DAYS: 1
        run: |
          CUTOFF=$(date -d "$KEEP_DAYS days ago" +%s)

          echo "Fetching workflows…"
          WORKFLOWS=$(curl -s \
            -H "Authorization: token $TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows" |
            jq -r '.workflows[].id')

          for WF in $WORKFLOWS; do
            echo "Workflow $WF"

            RUNS=$(curl -s \
              -H "Authorization: token $TOKEN" \
              "https://api.github.com/repos/$REPO/actions/workflows/$WF/runs?per_page=100" |
              jq -c '.workflow_runs[]')

            echo "$RUNS" | while read RUN; do
              ID=$(echo "$RUN" | jq -r '.id')
              CREATED=$(echo "$RUN" | jq -r '.created_at')
              BRANCH=$(echo "$RUN" | jq -r '.head_branch')

              TS=$(date -d "$CREATED" +%s)

              if [ "$TS" -lt "$CUTOFF" ] && [ -n "$BRANCH" ]; then
                echo "  Deleting run $ID (branch: $BRANCH, date: $CREATED)"

                curl -s -X DELETE \
                  -H "Authorization: token $TOKEN" \
                  "https://api.github.com/repos/$REPO/actions/runs/$ID"
              fi
            done
          done
