name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  j1_of_3-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint

  j2_of_3-test:
    runs-on: ubuntu-latest
    needs: j1_of_3-lint
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test

  j3_of_3-cleanup:
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write
      contents: read
    steps:
      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh jq

      - name: Authenticate GitHub CLI
        run: gh auth setup-git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old workflow runs
        env:
          KEEP_DAYS: 30
        run: |
          CUTOFF=$(date -d "$KEEP_DAYS days ago" +%s)

          gh workflow list --json id --jq '.[].id' | while read WF; do
            echo "Workflow $WF"

            gh run list --workflow "$WF" \
              --json databaseId,createdAt,headBranch \
              --limit 200 \
              --jq '.[] | @base64' |
            while read RUN; do
              j() { echo "$RUN" | base64 --decode | jq -r "$1"; }

              ID=$(j '.databaseId')
              CREATED=$(j '.createdAt')
              BRANCH=$(j '.headBranch')
              TS=$(date -d "$CREATED" +%s)

              if [ "$TS" -lt "$CUTOFF" ] && [ -n "$BRANCH" ]; then
                echo "  Deleting run $ID (branch: $BRANCH, date: $CREATED)"
                gh run delete "$ID" --confirm
              fi
            done
          done
