name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  j1_of_2-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint

  j2_of_2-test:
    runs-on: ubuntu-latest
    needs: j1_of_2-lint
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test

  j_cleanup:
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh jq

      - name: Delete old workflow runs
        env:
          KEEP_DAYS: 0
        run: |
          CUTOFF=$(date -d "$KEEP_DAYS days ago" +%s)

          gh workflow list --repo "$GITHUB_REPOSITORY" --json id --jq '.[].id' |
          while read WF; do
            echo "Workflow $WF"

            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$WF" \
              --json databaseId,createdAt,headBranch \
              --limit 200 \
              --jq '.[] | @base64' |
            while read RUN; do
              j() { echo "$RUN" | base64 --decode | jq -r "$1"; }

              ID=$(j '.databaseId')
              CREATED=$(j '.createdAt')
              BRANCH=$(j '.headBranch')
              TS=$(date -d "$CREATED" +%s)

              if [ "$TS" -lt "$CUTOFF" ] && [ -n "$BRANCH" ]; then
                echo "  Deleting run $ID (branch: $BRANCH, date: $CREATED)"
                gh run delete "$ID" --repo "$GITHUB_REPOSITORY"
              fi
            done
          done
